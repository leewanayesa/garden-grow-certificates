:root{--g:#2e7d32;--gl:#eef6ee}
*{box-sizing:border-box}
html,body{margin:0;background:#dfe5e0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#1d1d1d;-webkit-text-size-adjust:100%}

.doc{max-width:860px;margin:0 auto;padding:10px 8px 120px}

.f{position:absolute;border-radius:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;display:flex;align-items:flex-end;overflow:visible}
.f.t{background:rgba(46,125,50,.12);border-bottom:2px solid var(--g)}
.f.s,.f.i{background:rgba(46,125,50,.08);border:2px dashed var(--g);align-items:center;justify-content:center}
.f.req.empty{animation:pulse 1.8s ease-in-out infinite}

.f .tag{position:absolute;left:0;top:-17px;background:var(--g);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:9px;white-space:nowrap;pointer-events:none}
.f.filled .tag{display:none}

.f.t.filled{border-bottom-color:transparent}

.f.s .v,.f.i .v{position:absolute;inset:0;padding:0;display:flex;align-items:flex-end}
.f.i .v{align-items:center;justify-content:center}
.f img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.f.skip{opacity:0;pointer-events:auto}
.f.cur{outline:3px solid #f9a825;outline-offset:2px}
.skip{background:none;border:0;color:#2e7d32;font-weight:600;font-size:14px;padding:4px}
.f.s img{object-position:left bottom}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.14);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px}
.bar small{color:#666;font-size:12px}
.btn{border:0;border-radius:12px;padding:14px 18px;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.pri{background:var(--g);color:#fff;width:100%;max-width:440px}
.pri:disabled{background:#a7c4a8}
.sec{background:var(--gl);color:var(--g)}
.modal{position:fixed;inset:0;z-index:20;display:none;background:#fff;flex-direction:column}
.modal.open{display:flex}
.mh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid #e4e4e4}
.mh b{color:var(--g);font-size:17px}
.mh button{background:none;border:0;font-size:15px;font-weight:600;color:#555;padding:6px 4px}
.padwrap{flex:1;position:relative;margin:12px;border:2px solid #cfe3cf;border-radius:12px;background:#fcfffc;overflow:hidden;touch-action:none}
#pad{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.line{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1.5px solid #bcd3bc;pointer-events:none}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#b3c9b3;font-size:18px;pointer-events:none}
.mf{display:flex;gap:10px;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.mf .btn{flex:1}
.tip{text-align:center;font-size:12px;color:#777;padding:0 12px 8px}
.sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.35);align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .card{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet label{display:block;font-weight:700;color:var(--g);margin-bottom:10px}
.sheet input{width:100%;font-size:18px;padding:12px;border:1.5px solid #bcd3bc;border-radius:10px;outline:none}
.sheet input:focus{border-color:var(--g)}
.sheet .row{display:flex;gap:10px;margin-top:14px}
.sheet .row .btn{flex:1}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:30;display:none;max-width:90%;text-align:center}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.88);z-index:40;display:none;align-items:center;justify-content:center;font-weight:600;color:var(--g)}
</style>
