name: Delete signing pages older than 3 days

on:
  schedule:
    - cron: "17 0 * * *"   # every day at 04:17 Abu Dhabi time
  workflow_dispatch:        # can also be run by hand from the Actions tab

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove pages first uploaded more than 3 days ago
        run: |
          now=$(date +%s); limit=$((3*24*3600)); removed=""
          for f in *.html; do
            [ -e "$f" ] || continue
            [ "$f" = "index.html" ] && continue
            added=$(git log --diff-filter=A --follow --format=%ct -- "$f" | tail -1)
            [ -z "$added" ] && continue
            if [ $((now - added)) -gt $limit ]; then git rm -q "$f"; removed="$removed $f"; fi
          done
          if [ -n "$removed" ]; then
            git config user.name "garden-grow-cleanup"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Auto-delete signing pages older than 3 days:$removed"
            git push
            echo "Removed:$removed"
          else
            echo "Nothing older than 3 days."
          fi
